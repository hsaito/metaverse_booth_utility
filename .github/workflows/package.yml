name: Package Blender Addon

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from __init__.py
        id: version
        run: |
          VERSION=$(python3 - <<'EOF'
          import ast, sys
          with open("metaverse_booth_utility/__init__.py", encoding="utf-8") as f:
              tree = ast.parse(f.read())
          for node in ast.walk(tree):
              if isinstance(node, ast.Assign):
                  for t in node.targets:
                      if isinstance(t, ast.Name) and t.id == "bl_info":
                          d = ast.literal_eval(node.value)
                          print(".".join(str(x) for x in d["version"]))
                          sys.exit(0)
          raise SystemExit("Unable to read bl_info version")
          EOF
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          curl -L "https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz" -o blender.tar.xz
          tar -xf blender.tar.xz
          echo "$PWD/blender-5.2.1-linux-x64" >> "$GITHUB_PATH"
          blender-5.2.1-linux-x64/blender --version

      - name: Build zip package
        run: |
          mkdir dist
          xvfb-run -a blender-5.2.1-linux-x64/blender --background --command extension build --source-dir metaverse_booth_utility --output-dir dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: metaverse_booth_utility-${{ steps.version.outputs.version }}
          path: dist/
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
