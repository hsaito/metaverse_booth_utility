name: Package Blender Addon

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build package from blender_manifest.toml
        id: version
        run: |
          python3 - <<'EOF'
          from pathlib import Path
          import fnmatch
          import os
          import tomllib
          import zipfile

          source_dir = Path("metaverse_booth_utility")
          manifest_path = source_dir / "blender_manifest.toml"
          dist_dir = Path("dist")
          dist_dir.mkdir(exist_ok=True)

          manifest = tomllib.loads(manifest_path.read_text(encoding="utf-8"))
          addon_id = manifest.get("id", source_dir.name)
          version = manifest["version"]
          exclude_patterns = manifest.get("paths_exclude_pattern", [])

          def matches(path: Path, is_dir: bool) -> bool:
              rel = path.relative_to(source_dir).as_posix()
              rel_with_slash = rel + "/" if is_dir else rel
              for pat in exclude_patterns:
                  p = pat.strip()
                  if not p:
                      continue
                  p_norm = p.replace("\\", "/")
                  if fnmatch.fnmatch(rel, p_norm) or fnmatch.fnmatch(rel_with_slash, p_norm):
                      return True
                  if fnmatch.fnmatch(path.name, p_norm):
                      return True
              return False

          def is_in_excluded_dir(path: Path) -> bool:
              for parent in path.parents:
                  if parent == source_dir:
                      break
                  if matches(parent, True):
                      return True
              return False

          zip_path = dist_dir / f"{addon_id}-{version}.zip"
          with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as zf:
              for p in sorted(source_dir.rglob("*")):
                  if is_in_excluded_dir(p):
                      continue
                  if p.is_dir() and matches(p, True):
                      continue
                  if p.is_file() and matches(p, False):
                      continue
                  if p.is_file():
                      zf.write(p, p.as_posix())

          print(f"Created {zip_path}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"version={version}\\n")
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: metaverse_booth_utility-${{ steps.version.outputs.version }}
          path: dist/
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
