name: Lint defaults.json schema

on:
  push:
    branches:
      - main
    paths:
      - metaverse_booth_utility/defaults.json
      - metaverse_booth_utility/defaults.schema.json
      - .github/workflows/lint-defaults-schema.yml
  pull_request:
    branches:
      - main
    paths:
      - metaverse_booth_utility/defaults.json
      - metaverse_booth_utility/defaults.schema.json
      - .github/workflows/lint-defaults-schema.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-defaults-schema:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install schema validator
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema

      - name: Validate defaults.json against defaults.schema.json
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema_path = Path("metaverse_booth_utility/defaults.schema.json")
          data_path = Path("metaverse_booth_utility/defaults.json")

          schema = json.loads(schema_path.read_text(encoding="utf-8"))
          data = json.loads(data_path.read_text(encoding="utf-8"))

          validator = Draft202012Validator(schema)
          errors = sorted(validator.iter_errors(data), key=lambda err: list(err.path))

          if errors:
              print(f"Validation failed with {len(errors)} error(s):")
              for err in errors:
                  path = ".".join(str(part) for part in err.path)
                  location = path if path else "<root>"
                  print(f"- {location}: {err.message}")
              raise SystemExit(1)

          print("defaults.json is valid against defaults.schema.json")
          PY
